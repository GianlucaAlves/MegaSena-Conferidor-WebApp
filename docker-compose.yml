services:
  postgres:
    image: postgres:latest
    container_name: atividade03-postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atividade03-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT}:3333"
    environment:
      PORT: 3333
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_HOST: postgres
      DB_PORT: 5432
   
  front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atividade03-front
    depends_on:
      - server
    ports:
      - "${FRONT_PORT}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
    - .:/app
    - /app/node_modules
